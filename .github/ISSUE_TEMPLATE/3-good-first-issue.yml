name: Good First Issue
description: A great starting point for new contributors
title: "[Good First Issue]: "
labels: ["good-first-issue"]
body:
  - type: markdown
    attributes:
      value: |
        ## Good First Issue

        Thanks for your interest in contributing to Ihawu! This is a great place to start.

        ### Before You Start
        - Read our [Contribution Guidelines](https://github.com/maureenCindy/ihawu/blob/main/CONTRIBUTING.md)
        - Comment on this issue to get assigned (avoid duplicate work)
        - Ask questions if anything is unclear!

  - type: markdown
    attributes:
      value: |
        ### Task Description

        *(Describe the specific task here - this will be customized per issue)*

  - type: textarea
    id: task
    attributes:
      label: Task Details
      description: What needs to be done?
      placeholder: |
        - Add unit tests for IhawuPrincipal serialization
        - Update documentation for Spring Boot configuration
        - Fix ktlint violations in ihawu-core module
      render: markdown
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What must be completed for this issue to be resolved?
      placeholder: |
        - [ ] All tests pass (./gradlew test)
        - [ ] Code style checks pass (./gradlew ktlintCheck)
        - [ ] Documentation updated
        - [ ] PR description links to this issue (Closes #N)
      render: markdown
    validations:
      required: true

  - type: textarea
    id: resources
    attributes:
      label: Resources
      description: Helpful resources to get started
      placeholder: |
        - [Architecture Guide](link)
        - [Setup Instructions](link)
        - [Module Structure](link)

  - type: markdown
    attributes:
      value: |
        ### Development Setup

        ```bash
        # Clone the repo
        git clone https://github.com/maureenCindy/ihawu.git
        cd ihawu

        # Run the linter
        ./gradlew ktlintCheck

        # Run tests
        ./gradlew test

        # Build the project
        ./gradlew build
        ```

  - type: checkboxes
    id: assignment
    attributes:
      label: Claiming This Issue
      options:
        - label: I have commented on this issue requesting assignment
          required: true
        - label: I have read and agree to the Contribution Guidelines
          required: true
        - label: I understand that my PR must follow Conventional Commits
          required: true