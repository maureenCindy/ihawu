name: Bug Report
description: File a bug report to help us improve Ihawu
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        
        Thanks for taking the time to fill out this bug report!
        
        ### Before You Start
        - Please search existing issues to avoid duplicates
        - Ensure you're using the latest version
        
  - type: input
    id: version
    attributes:
      label: Ihawu Version
      description: Which version of Ihawu are you using?
      placeholder: e.g., 0.1.0
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: Framework
      description: Which framework are you using?
      options:
        - Spring Boot 3.x
        - Spring Boot 2.x
        - Ktor 3.x
        - Ktor 2.x
        - Other
    validations:
      required: true

  - type: dropdown
    id: policy-engine
    attributes:
      label: Policy Engine
      description: Which policy engine are you using with Ihawu?
      options:
        - OPA (Open Policy Agent)
        - Casbin
        - None (Using built-in rules)
        - Custom
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: When I try to mask nested fields with Jackson, the serialization fails...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide a minimal code example or steps to reproduce the issue
      placeholder: |
        1. Configure Ihawu with OPA
        2. Define policy that masks 'address.city'
        3. Make request to endpoint returning User object
        4. Observe error: ...
      render: kotlin
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: The 'address.city' field should be masked or hidden
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: The field appears unmasked or throws NullPointerException
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant log output
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Contribution Checklist
      description: Before submitting, please confirm you've read our contribution guidelines
      options:
        - label: I have searched for existing issues
          required: true
        - label: I have read the [Contribution Guidelines](https://github.com/maureenCindy/ihawu/blob/main/CONTRIBUTING.md)
          required: true
        - label: I have verified this issue is reproducible with the latest version
          required: false
