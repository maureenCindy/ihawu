name: "Verify Pull Request & Build Integrity"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java Toolchain
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle Packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Code Style Linting Checks
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run Framework Integration & Unit Test Suites
        run: ./gradlew check --no-daemon

      - name: Validate Executable Documentation Samples
        run: ./gradlew dokkaGenerate --no-daemon

      # Prove the PUBLISHED shape is consumable: publish the SNAPSHOT locally, then build the
      # standalone smoke test that depends only on org.ihawu:* from mavenLocal. Skipped on tags,
      # where the version is a signed release that wouldn't match the smoke test's SNAPSHOT default.
      - name: Publish Artifacts to Maven Local
        if: github.ref_type != 'tag'
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Smoke-test the Published Artifacts
        if: github.ref_type != 'tag'
        run: ./gradlew -p smoke-test test --no-daemon
