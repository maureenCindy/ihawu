name: Deploy Dokka Documentation

on:
  push:
    branches:
      - main
    # A release tag redeploys the docs so the version label matches the just-published artifact.
    # Without this, docs deploy only on a main push, which a tag-only release does not produce —
    # leaving the site on the previous version until the next unrelated push.
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudfare

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fetch tags so the docs can be labelled with the latest release version below.
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      # docs.ihawu.org deploys from main (a branch build), so the project version would be
      # 0.1.0-SNAPSHOT. Label the site with the latest release tag instead, so it matches the
      # published artifact. Falls back to the SNAPSHOT default when no v* tag exists yet.
      - name: Generate aggregated API docs
        run: |
          VERSION="$(git tag --list 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')"
          echo "Documenting version: ${VERSION:-<snapshot fallback>}"
          ./gradlew dokkaGenerate --no-daemon ${VERSION:+-PdocsVersion="$VERSION"}

      # Dokka does not content-hash its asset filenames, so scripts/main.js, styles/*.css, the
      # search index, navigation.html and the logo keep the same names but change contents across
      # deploys. Without this, a browser serves a previous deploy's cached file against new HTML —
      # which breaks the theme and menu toggles and shows a stale logo. Tell Cloudflare Pages to
      # revalidate everything (cheap ETag 304s) so new deploys are always picked up.
      - name: Add Cloudflare Pages cache headers
        run: |
          cat > build/dokka/html/_headers <<'EOF'
          /*
            Cache-Control: public, max-age=0, must-revalidate
          EOF

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=main forces a PRODUCTION deploy regardless of the triggering ref. Without it, a
          # v* tag build (branch context "v0.3.0") is treated by Pages as a PREVIEW deploy and never
          # reaches docs.ihawu.org — leaving production on the last main-push version. Every trigger
          # here (main push, v* tag, manual dispatch) is meant to update production, so pin it.
          command: pages deploy build/dokka/html --project-name=ihawu-docs --branch=main
