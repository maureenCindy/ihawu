name: "Publish Production Release"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Verify the build before publishing — prevents shipping broken releases
  verify:
    uses: ./.github/workflows/verify.yml

  # Compile, sign, and ship production JAR binaries to Maven Central
  publish-artifacts:
    runs-on: ubuntu-latest
    needs: verify
    environment: maven-central
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Java Toolchain
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle Packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}

      - name: Publish to Maven Central
        # First release: uploads + validates, then stops at "pending" for a manual Release in the
        # Central Portal UI. Switch to publishAndReleaseToMavenCentral to auto-release once trusted.
        run: ./gradlew publishToMavenCentral --no-configuration-cache --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}