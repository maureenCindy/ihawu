name: "Publish Production Release & Docs"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Verify the build before publishing — prevents shipping broken releases
  verify:
    uses: ./.github/workflows/verify.yml

  # Compile, sign, and ship production JAR binaries to Maven Central
  publish-artifacts:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Java Toolchain
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}

      - name: Release Binaries to Sonatype Central
        run: ./gradlew publishAllPublicationsToSonatypeRepository --no-daemon
        env:
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  # Compile executable samples and deploy the stable HTML site to GitHub Pages
  publish-documentation:
    runs-on: ubuntu-latest
    needs: publish-artifacts
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Java Toolchain
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}

      - name: Compile Executable Documentation HTML
        run: ./gradlew dokkaHtmlMultiModule --no-daemon

      - name: Deploy Stable Release Documentation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/dokka/htmlMultiModule
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "docs: publish documentation for release ${{ github.ref_name }} [skip ci]"